<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum dokumentów</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<!-- ================= HEADER ================= -->


<header class="topbar">


<div class="logo">
Archiwum dokumentów
</div>



<div>


<button 
id="menuBtn"
class="menu-button">

☰

</button>



<div 
id="menuList"
class="menu-list hidden">


<button id="addBtn">
Dodaj dokument
</button>


<button id="settingsBtn">
Ustawienia
</button>


<button id="exportBtn">
Export
</button>



</div>


</div>


</header>





<!-- ================= FILTRY ================= -->


<section class="filters">


<div 
id="locationTabs"
class="location-tabs">

</div>



<div class="filter-box">


<input 
id="searchInput"
type="text"
placeholder="Szukaj dokumentu...">


<select id="yearFilter">


<option value="">
Wszystkie lata
</option>


</select>



<select id="statusFilter">


<option value="">
Wszystkie statusy
</option>


<option value="OK">
OK
</option>


<option value="DO UZUPEŁNIENIA">
DO UZUPEŁNIENIA
</option>


<option value="BRAK">
BRAK
</option>


</select>


</div>


</section>







<!-- ================= DOKUMENTY ================= -->


<main id="results">


</main>







<!-- ================= MODAL DOKUMENT ================= -->


<div 
id="modalOverlay"
class="overlay hidden">


<div class="modal">


<button 
id="closeModal"
class="close-button">

X

</button>



<h2 id="modalTitle">
Dodaj dokument
</h2>





<label>
Lokalizacja
</label>


<select id="location">

</select>




<label>
Lokal
</label>


<select id="local">

<option>
Najpierw wybierz lokalizację
</option>

</select>





<label>
Nazwa dokumentu
</label>


<input id="name">






<label>
Typ dokumentu
</label>


<input id="type">






<label>
Rok
</label>


<input 
id="year"
type="number">






<label>
Kontrahent
</label>


<input id="contractor">





<label>
Regał
</label>


<input id="shelf">





<label>
Półka
</label>


<input id="level">






<label>
Segregator
</label>


<input id="folder">






<label>
Status
</label>


<select id="status">


<option>
OK
</option>


<option>
DO UZUPEŁNIENIA
</option>


<option>
BRAK
</option>


</select>





<label>
Uwagi
</label>


<textarea id="notes"></textarea>





<button 
id="saveBtn"
class="primary-button">

Zapisz

</button>



</div>


</div>










<!-- ================= USTAWIENIA ================= -->


<div 
id="settingsOverlay"
class="overlay hidden">


<div class="modal settings-modal">


<button 
id="closeSettings"
class="close-button">

X

</button>




<h2>
Ustawienia
</h2>





<h3>
Dodaj kontrahenta
</h3>



<input 
id="newContractor"
placeholder="Nazwa kontrahenta">


<button 
id="addContractorBtn">

Dodaj kontrahenta

</button>







<h3>
Dodaj lokal
</h3>



<input 
id="localMPK"
placeholder="MPK">


<input 
id="localName"
placeholder="Nazwa lokalu">



<select id="localLocation">

</select>



<button 
id="addLocalBtn">

Dodaj lokal

</button>



</div>


</div>









<!-- ================= SKRYPTY ================= -->


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/supabase.js"></script>

<script src="js/config.js"></script>


<script src="js/app.js"></script>

<script src="js/admin.js"></script>

<script src="js/settings.js"></script>

<script src="js/menu.js"></script>

<script src="js/export.js"></script>



</body>

</html>
