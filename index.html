<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum dokumentów</title>

  

<link rel="stylesheet" href="style.css">

</head>



<body>


<header class="topbar">


<div class="logo">

Archiwum dokumentów

</div>


<button id="themeToggle" class="theme-toggle">
    🌙
</button>

<div class="menu-wrapper">


<button 
id="menuBtn"
class="menu-button">

☰

</button>



<div 
id="menuList"
class="menu-list hidden">


<button id="addBtn">

Dodaj dokument

</button>



<button id="settingsBtn">

Ustawienia

</button>



<button id="exportBtn">

Eksport

</button>


</div>


</div>


</header>








<section class="filters">



<div 
id="locationTabs"
class="location-tabs">

</div>

<div id="dashboardStats" class="dashboard-stats"></div>





<div class="filter-box">


<input 
id="searchInput"
placeholder="Szukaj dokumentu...">

<select id="localFilter">
<option value="">Wszystkie lokale</option>
</select>

<select id="contractorFilter">
<option value="">Wszyscy kontrahenci</option>
</select>





<select id="yearFilter">


<option value="">

Wszystkie lata

</option>


</select>





<select id="statusFilter">


<option value="">

Wszystkie statusy

</option>


<option value="OK">

OK

</option>


<option value="DO UZUPEŁNIENIA">

DO UZUPEŁNIENIA

</option>


<option value="BRAK">

BRAK

</option>


</select>


</div>

<p class="filter-help">Wybierz lokalizację na kafelku lub użyj filtrów, aby szybko zawęzić listę.</p>


</section>







<main id="results" aria-live="polite">

</main>









<!-- =========================
DODAJ / EDYTUJ DOKUMENT
========================= -->


<div

id="modalOverlay"

class="overlay hidden">



<div class="modal document-modal">


<button

id="closeModal"

class="close-button">

X

</button>



<h2 id="modalTitle">

Dodaj dokument

</h2>





<div class="form-grid">



<div class="form-group">

<label>

Lokalizacja

</label>


<select id="location">


<option value="">

Wybierz lokalizację

</option>


</select>


</div>





<div class="form-group">


<label>

Lokal

</label>



<select id="local">


<option>

Najpierw wybierz lokalizację

</option>


</select>


</div>






<div class="form-group">


<label>

Nazwa dokumentu

</label>



<input id="name">


</div>





<div class="form-group">


<label>

Typ dokumentu

</label>


<input id="type">


</div>





<div class="form-group">


<label>

Rok

</label>


<input 
id="year"
type="number">


</div>





<div class="form-group">


<label>

Kontrahent

</label>


<select id="contractor">


<option>

Wybierz kontrahenta

</option>


</select>


</div>






<div class="form-group">


<label>

Regał

</label>


<input id="shelf">


</div>





<div class="form-group">


<label>

Półka

</label>


<input id="level">


</div>





<div class="form-group">


<label>

Segregator

</label>


<input id="folder">


</div>





<div class="form-group">


<label>

Status

</label>


<select id="status">


<option>

OK

</option>


<option>

DO UZUPEŁNIENIA

</option>


<option>

BRAK

</option>


</select>


</div>





<div class="form-group full-width">


<label>

Uwagi

</label>


<textarea id="notes"></textarea>


</div>






<button

id="saveBtn"

class="primary-button full-width">


Zapisz dokument


</button>




</div>


</div>


</div>









<!-- =========================
USTAWIENIA
========================= -->


<div

id="settingsOverlay"

class="overlay hidden">



<div class="modal settings-modal">


<button

id="closeSettings"

class="close-button">

X

</button>




<h2>

Ustawienia

</h2>




<div class="settings-buttons">



<button id="showAddContractor">

Dodaj kontrahenta

</button>




<button id="showContractors">

Lista kontrahentów

</button>




<button id="showAddLocal">

Dodaj lokal

</button>




<button id="showLocals">

Lista lokali

</button>



</div>




<div id="settingsContent">

</div>



</div>


</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/app.js"></script>

<script src="js/admin.js"></script>

<script src="js/settings.js"></script>

<script src="js/menu.js"></script>

<script src="js/export.js"></script>



</body>


</html>
