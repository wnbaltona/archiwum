<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>


<div class="logo">
Archiwum Dokumentów
</div>



<div class="menu">


<button id="menuBtn">
Menu
</button>



<div id="menuList" class="dropdown">


<button id="addBtn">
Dodaj dokument
</button>



<button id="allLocations">
Wszystkie lokalizacje
</button>



<button id="deleteModeBtn">
Usuń dokument
</button>



</div>


</div>


</header>





<main>



<input
id="searchInput"
placeholder="Wyszukaj dokument, lokal, regał..."
>



<div id="locationTabs"></div>



<div id="filters">


<select id="typeFilter">

<option value="">
Wszystkie typy
</option>

</select>



<select id="shelfFilter">

<option value="">
Wszystkie regały
</option>

</select>


</div>





<div id="results"></div>







<section id="adminPanel" class="hidden">


<h2>
Dodaj dokument
</h2>




<label>
Lokalizacja
</label>


<select id="location">


<option>OKĘCIE</option>
<option>RADOM</option>
<option>MODLIN</option>
<option>SONATA</option>
<option>RZESZÓW</option>
<option>KATOWICE</option>
<option>KRAKÓW</option>
<option>ZIELONA GÓRA</option>
<option>FRANCJA</option>
<option>BYDGOSZCZ</option>
<option>POZNAŃ</option>
<option>WROCŁAW</option>


</select>





<label>
Numer lokalu
</label>


<input
id="number"
placeholder="Numer lokalu"
>





<label>
Nazwa dokumentu
</label>


<input
id="name"
placeholder="Nazwa dokumentu"
>





<label>
Typ dokumentu
</label>


<input
id="type"
placeholder="Typ dokumentu"
>





<label>
Regał
</label>


<input
id="shelf"
placeholder="Regał"
>





<label>
Półka
</label>


<input
id="level"
placeholder="Półka"
>





<label>
Segregator
</label>


<input
id="folder"
placeholder="Segregator"
>





<label>
Uwagi
</label>


<textarea
id="notes"
placeholder="Uwagi">
</textarea>





<button id="saveBtn">
Zapisz dokument
</button>



</section>






</main>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="./js/supabase.js"></script>


<script src="./js/app.js"></script>


<script src="./js/admin.js"></script>


<script src="./js/menu.js"></script>



</body>

</html>
