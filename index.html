<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">


<div class="logo">
📁 Archiwum Dokumentów
</div>



<div class="menu">


<button id="menuButton">
☰ Menu
</button>



<div id="dropdown" class="dropdown">


<button id="showAdmin">
➕ Dodaj dokument
</button>


<button>
📋 Wszystkie dokumenty
</button>


<button>
⚙️ Ustawienia
</button>


</div>


</div>


</header>




<main>


<div class="search-box">


<input 
id="searchInput"
placeholder="🔍 Szukaj dokumentu, miasta, lokalu..."
>


</div>

<button id="showAdmin">
➕ Dodaj dokument
</button>


<section id="adminPanel" class="hidden">

<h3>Dodaj dokument</h3>


<select id="location">

<option>OKĘCIE</option>
<option>RADOM</option>
<option>MODLIN</option>
<option>SONATA</option>
<option>RZESZÓW</option>
<option>KATOWICE</option>
<option>KRAKÓW</option>
<option>ZIELONA GÓRA</option>
<option>FRANCJA</option>
<option>BYDGOSZCZ</option>
<option>POZNAŃ</option>
<option>WROCŁAW</option>

</select>


<input id="name" placeholder="Nazwa dokumentu">


<input id="type" placeholder="Typ">


<input id="shelf" placeholder="Regał">


<input id="level" placeholder="Półka">


<input id="folder" placeholder="Segregator">


<textarea id="notes"
placeholder="Uwagi"></textarea>


<button id="addDocument">
Zapisz dokument
</button>


</section>

<section id="results"></section>




<section id="adminPanel" class="hidden">


<h3>
➕ Dodaj dokument
</h3>


<input id="name" placeholder="Nazwa dokumentu">

<input id="type" placeholder="Typ">

<input id="city" placeholder="Miasto">

<input id="local" placeholder="Lokal">

<input id="shelf" placeholder="Regał">

<input id="level" placeholder="Półka">

<input id="folder" placeholder="Segregator">

<textarea id="notes" placeholder="Uwagi"></textarea>


<button id="addDocument">
Zapisz
</button>


</section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/app.js"></script>

<script src="js/admin.js"></script>


</body>

</html>
