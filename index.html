<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">


<div class="logo">
Archiwum Dokumentów
</div>



<div class="menu">


<button 
id="menuBtn"
class="menu-button">

Menu

</button>



<div 
id="menuList"
class="dropdown">


<button id="addBtn">
Dodaj dokument
</button>


<button id="exportExcelBtn">
Eksport Excel
</button>


<button id="exportCsvBtn">
Eksport CSV
</button>


<button id="missingBtn">
Raport brakujących
</button>


<button id="settingsBtn">
Ustawienia
</button>



</div>


</div>


</header>






<main class="container">





<!-- WYSZUKIWANIE -->


<div class="search-box">


<input

id="searchInput"

placeholder="Szukaj dokumentu, lokalu, regału..."

>


</div>







<!-- LOKALIZACJE -->


<section class="location-section">


<h2>
Lokalizacje
</h2>



<div 
id="locationTabs"
class="location-tabs">

</div>


</section>








<!-- FILTRY -->


<div class="filters">


<select id="typeFilter">


<option value="">
Wszystkie typy
</option>


</select>





<select id="shelfFilter">


<option value="">
Wszystkie regały
</option>


</select>





<select id="statusFilter">


<option value="">
Wszystkie statusy
</option>


<option>
OK
</option>


<option>
Do uzupełnienia
</option>


<option>
Brak dokumentu
</option>


<option>
Nieaktualny
</option>


</select>



</div>








<!-- LISTA DOKUMENTÓW -->


<div id="results">


</div>





</main>









<!-- MODAL DODAWANIA / EDYCJI -->


<div 
id="modalOverlay"
class="modal-overlay hidden">



<div class="modal">



<button

id="closeModal"

class="close-modal">

×

</button>





<h2 id="modalTitle">
Dodaj dokument
</h2>






<div class="form-grid">





<div class="form-group">


<label>
Lokalizacja *
</label>


<select id="location">

<option value="">
Wybierz lokalizację
</option>


<option>OKĘCIE</option>
<option>RADOM</option>
<option>MODLIN</option>
<option>SONATA</option>
<option>RZESZÓW</option>
<option>KATOWICE</option>
<option>KRAKÓW</option>
<option>ZIELONA GÓRA</option>
<option>FRANCJA</option>
<option>BYDGOSZCZ</option>
<option>POZNAŃ</option>
<option>WROCŁAW</option>
<option>GDAŃSK</option>
<option>GDYNIA</option>
<option>ŚWINOUJŚCIE</option>

</select>


</div>








<div class="form-group">


<label>
Numer lokalu *
</label>


<input 
id="number"
placeholder="Numer lokalu">


</div>








<div class="form-group">


<label>
Nazwa dokumentu *
</label>


<input 
id="name"
placeholder="Nazwa dokumentu">


</div>








<div class="form-group">


<label>
Typ *
</label>


<input 
id="type"
placeholder="Typ dokumentu">


</div>








<div class="form-group">


<label>
Regał *
</label>


<input 
id="shelf"
placeholder="Regał">


</div>








<div class="form-group">


<label>
Półka *
</label>


<input 
id="level"
placeholder="Półka">


</div>








<div class="form-group">


<label>
Segregator *
</label>


<input 
id="folder"
placeholder="Segregator">


</div>








<div class="form-group">


<label>
Status *
</label>


<select id="status">


<option>
OK
</option>


<option>
Do uzupełnienia
</option>


<option>
Brak dokumentu
</option>


<option>
Nieaktualny
</option>


</select>


</div>








<div class="form-group full">


<label>
Uwagi
</label>


<textarea 
id="notes">

</textarea>


</div>




</div>







<div 
id="successBox"
class="success hidden">

</div>




<div 
id="errorBox"
class="error hidden">

</div>








<div class="modal-buttons">


<button

id="saveBtn"

class="primary-btn">

Zapisz dokument

</button>



</div>





</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./js/supabase.js"></script>

<script src="./js/app.js"></script>

<script src="./js/admin.js"></script>

<script src="./js/menu.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="./js/export.js"></script>


</body>

</html>
