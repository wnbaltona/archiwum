<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

<div class="logo">
Archiwum dokumentów
</div>


<div class="menu-wrapper">

<button 
id="menuBtn"
class="menu-button">
☰
</button>


<div 
id="menuList"
class="menu-list hidden">


<button id="addBtn">
Dodaj dokument
</button>


<button id="settingsBtn">
Ustawienia
</button>


<button id="exportBtn">
Eksport
</button>


</div>

</div>

</header>





<section class="filters">


<div id="locationTabs"
class="location-tabs">
</div>



<div class="filter-box">


<input 
id="searchInput"
placeholder="Szukaj dokumentu...">



<select id="yearFilter">

<option value="">
Wszystkie lata
</option>

</select>



<select id="statusFilter">

<option value="">
Wszystkie statusy
</option>

<option value="OK">
OK
</option>

<option value="DO UZUPEŁNIENIA">
DO UZUPEŁNIENIA
</option>

<option value="BRAK">
BRAK
</option>

</select>


</div>

</section>






<main id="results"></main>









<!-- MODAL DOKUMENT -->


<div 
id="modalOverlay"
class="overlay hidden">


<div class="modal document-modal">


<button 
id="closeModal"
class="close-button">
X
</button>



<h2 id="modalTitle">
Dodaj dokument
</h2>




<div class="form-grid">



<div class="form-group">

<label>
Lokalizacja
</label>

<select id="location">

<option>
Wybierz lokalizację
</option>

</select>

</div>





<div class="form-group">

<label>
Lokal
</label>

<select id="local">

<option>
Najpierw wybierz lokalizację
</option>

</select>

</div>





<div class="form-group">

<label>
Nazwa dokumentu
</label>

<input id="name">

</div>





<div class="form-group">

<label>
Typ dokumentu
</label>

<input id="type">

</div>





<div class="form-group">

<label>
Rok
</label>

<input 
id="year"
type="number">

</div>





<div class="form-group">

<label>
Kontrahent
</label>


<select id="contractor">

<option value="">
Wybierz kontrahenta
</option>

</select>


</div>





<div class="form-group">

<label>
Regał
</label>

<input id="shelf">

</div>





<div class="form-group">

<label>
Półka
</label>

<input id="level">

</div>





<div class="form-group">

<label>
Segregator
</label>

<input id="folder">

</div>





<div class="form-group">

<label>
Status
</label>

<select id="status">

<option>
OK
</option>

<option>
DO UZUPEŁNIENIA
</option>

<option>
BRAK
</option>

</select>


</div>






<div class="form-group full-width">

<label>
Uwagi
</label>

<textarea id="notes"></textarea>

</div>






<button 
id="saveBtn"
class="primary-button full-width">

Zapisz dokument

</button>




</div>


</div>


</div>



<!-- USTAWIENIA -->

<div 
id="settingsOverlay"
class="overlay hidden">


<div class="modal settings-modal">


<button 
id="closeSettings"
class="close-button">

X

</button>



<h2>
Ustawienia
</h2>




<h3>
Dodaj kontrahenta
</h3>


<input 
id="newContractor"
placeholder="Nazwa kontrahenta">


<button 
id="addContractorBtn">

Dodaj kontrahenta

</button>




<h3>
Lista kontrahentów
</h3>


<div id="contractorsList">

</div>





<h3>
Dodaj lokal
</h3>



<input 
id="localMPK"
placeholder="MPK">



<input 
id="localName"
placeholder="Nazwa lokalu">



<select id="localLocation">

<option>
Wybierz lokalizację
</option>

</select>




<button 
id="addLocalBtn">

Dodaj lokal

</button>

<h3>
Lista lokali
</h3>


<div id="localsList">

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/config.js"></script>

<script src="js/app.js"></script>

<script src="js/admin.js"></script>

<script src="js/settings.js"></script>

<script src="js/menu.js"></script>

<script src="js/export.js"></script>


</body>

</html>
