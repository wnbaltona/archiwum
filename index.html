<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <h1>📁 Archiwum Dokumentów</h1>
    <p>Szybkie wyszukiwanie lokalizacji dokumentów</p>
</header>


<main>

<section class="search-section">

<input 
id="searchInput"
type="text"
placeholder="🔍 Wpisz nazwę dokumentu, miasto lub lokal..."
>

</section>

<button id="showAdmin">
➕ Dodaj dokument
</button>


<section id="adminPanel" class="hidden">

<h2>Dodaj nowy dokument</h2>


<input id="name" placeholder="Nazwa dokumentu">

<input id="type" placeholder="Typ dokumentu">

<input id="city" placeholder="Miasto">

<input id="local" placeholder="Lokal">

<input id="shelf" placeholder="Regał">

<input id="level" placeholder="Półka">

<input id="folder" placeholder="Segregator">

<textarea id="notes" placeholder="Uwagi"></textarea>


<button id="addDocument">
Zapisz dokument
</button>


</section>

<section id="results">

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/app.js"></script>

</body>
</html>
