<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">


<div class="logo">
Archiwum Dokumentów
</div>



<div class="menu">


<button id="menuBtn" class="menu-button">
☰
</button>




<div id="menuList" class="dropdown hidden">


<button id="addBtn">
Dodaj dokument
</button>


<button id="settingsBtn">
Ustawienia
</button>


<button id="exportBtn">
Eksport
</button>


</div>


</div>


</header>







<main class="container">



<section class="locations-section">


<h2>
Lokalizacje
</h2>



<div id="locationTabs" class="location-tabs">

</div>



</section>








<section class="toolbar">


<input

id="searchInput"

placeholder="Szukaj dokumentu..."

>



</section>







<div id="results">

</div>






</main>









<!-- =====================
MODAL DODAWANIA / EDYCJI
===================== -->


<div id="modalOverlay" class="modal-overlay hidden">



<div class="modal">


<button id="closeModal" class="close-modal">

×

</button>



<h2 id="modalTitle">

Dodaj dokument

</h2>






<div class="form-grid">



<div class="form-group">

<label>
Lokalizacja *
</label>


<select id="location">

<option value="">
Wybierz lokalizację
</option>

</select>

</div>







<div class="form-group">

<label>
Lokal *
</label>


<select id="local">

<option value="">
Najpierw wybierz lokalizację
</option>

</select>

</div>








<div class="form-group">


<label>
Kontrahent
</label>


<select id="contractor">

<option value="">
Wybierz kontrahenta
</option>

</select>


</div>








<div class="form-group">


<label>
Nazwa dokumentu *
</label>


<input id="name">

</div>







<div class="form-group">


<label>
Typ dokumentu *
</label>


<input id="type">

</div>








<div class="form-group">


<label>
Rok *
</label>


<input 
id="year"
type="number">

</div>







<div class="form-group">


<label>
Regał *
</label>


<input id="shelf">

</div>







<div class="form-group">


<label>
Półka *
</label>


<input id="level">

</div>








<div class="form-group">


<label>
Segregator *
</label>


<input id="folder">

</div>








<div class="form-group">


<label>
Status
</label>


<select id="status">

<option>
OK
</option>

<option>
Do uzupełnienia
</option>

<option>
Brak dokumentu
</option>


</select>


</div>








<div class="form-group full">


<label>
Uwagi
</label>


<textarea id="notes"></textarea>


</div>



</div>








<button id="saveBtn" class="primary-btn">

Zapisz dokument

</button>





</div>


</div>









<!-- =====================
USTAWIENIA
===================== -->


<div id="settingsOverlay" class="modal-overlay hidden">



<div class="modal">


<button id="closeSettings" class="close-modal">

×

</button>




<h2>
Ustawienia
</h2>








<section class="settings-box">


<h3>
Dodaj kontrahenta
</h3>



<input

id="newContractor"

placeholder="Nazwa kontrahenta"

>




<button id="addContractorBtn" class="primary-btn">

Dodaj kontrahenta

</button>



</section>








<section class="settings-box">


<h3>
Dodaj lokal
</h3>




<input

id="localMPK"

placeholder="MPK"

>





<input

id="localName"

placeholder="Nazwa lokalu"

>







<select id="localLocation">


<option value="">
Wybierz lokalizację
</option>


<option>
WARSZAWA
</option>


<option>
GDAŃSK
</option>


<option>
GDYNIA
</option>


<option>
ŚWINOUJŚCIE
</option>



</select>







<button id="addLocalBtn" class="primary-btn">

Dodaj lokal

</button>




</section>







</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="./js/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
<script src="./js/admin.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/menu.js"></script>
<script src="./js/export.js"></script>



</body>

</html>
