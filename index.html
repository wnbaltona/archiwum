<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">


<div class="logo">
Archiwum Dokumentów
</div>




<div class="menu">


<button id="menuBtn" class="menu-button">
Menu
</button>




<div id="menuList" class="dropdown">


<button id="addBtn">
Dodaj dokument
</button>


<button id="allLocations">
Wszystkie lokalizacje
</button>


</div>


</div>


</header>







<main class="container">



<div class="search-box">


<input 
id="searchInput"
placeholder="Wyszukaj dokument, lokal, regał..."
>


</div>





<section class="location-section">


<h3>
Lokalizacje
</h3>


<div 
id="locationTabs"
class="location-tabs">
</div>


</section>






<div class="filters">


<select id="typeFilter">


<option value="">
Wszystkie typy
</option>


</select>





<select id="shelfFilter">


<option value="">
Wszystkie regały
</option>


</select>



</div>







<div id="results"></div>




</main>









<!-- MODAL DODAWANIA / EDYCJI -->


<div 
id="modalOverlay" 
class="modal-overlay hidden">





<div class="modal">





<button 
id="closeModal"
class="close-modal">

×

</button>







<div class="modal-header">


<h2 id="modalTitle">

Dodaj dokument

</h2>


</div>








<div class="form-grid">







<div class="form-group">


<label>
Lokalizacja *
</label>



<select id="location">


<option value="">
Wybierz lokalizację
</option>


<option>
OKĘCIE
</option>


<option>
RADOM
</option>


<option>
MODLIN
</option>


<option>
SONATA
</option>


<option>
RZESZÓW
</option>


<option>
KATOWICE
</option>


<option>
KRAKÓW
</option>


<option>
ZIELONA GÓRA
</option>


<option>
FRANCJA
</option>


<option>
BYDGOSZCZ
</option>


<option>
POZNAŃ
</option>


<option>
WROCŁAW
</option>


</select>


</div>







<div class="form-group">


<label>
Numer lokalu *
</label>



<input 
id="number"
placeholder="np. 101">


</div>







<div class="form-group full">


<label>
Nazwa dokumentu *
</label>


<input 
id="name"
placeholder="np. Umowa najmu">


</div>







<div class="form-group">


<label>
Typ dokumentu *
</label>


<input 
id="type"
placeholder="np. Umowa">


</div>







<div class="form-group">


<label>
Regał *
</label>


<input 
id="shelf"
placeholder="np. A12">


</div>







<div class="form-group">


<label>
Półka *
</label>


<input 
id="level"
placeholder="np. 3">


</div>







<div class="form-group">


<label>
Segregator *
</label>


<input 
id="folder"
placeholder="np. Czerwony">


</div>







<div class="form-group full">


<label>
Uwagi
</label>


<textarea 
id="notes"
placeholder="Dodatkowe informacje">
</textarea>


</div>





</div>







<div 
id="errorBox" 
class="error hidden">
</div>







<div class="modal-buttons">


<button 
id="saveBtn"
class="primary-btn">

Zapisz dokument

</button>


</div>







<div 
id="successBox"
class="success hidden">


<p>
Dokument został zapisany.
</p>


<button id="closeAfterSave">

Zamknij

</button>


</div>






</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="./js/supabase.js"></script>


<script src="./js/app.js"></script>


<script src="./js/admin.js"></script>


<script src="./js/menu.js"></script>



</body>

</html>
