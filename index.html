<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archiwum Dokumentów</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">


<div class="logo">

Archiwum Dokumentów

</div>




<div class="menu">


<button 
class="menu-button"
id="menuBtn">

Menu

</button>




<div 
id="menuList"
class="dropdown">


<button id="addBtn">

Dodaj dokument

</button>


<button id="exportExcelBtn">

Eksport Excel

</button>


<button id="exportCsvBtn">

Eksport CSV

</button>


<button id="missingBtn">

Raport brakujących

</button>


<button id="settingsBtn">

Ustawienia

</button>



</div>


</div>


</header>







<main class="container">





<!-- SZUKAJ -->


<div class="search-box">


<input

id="searchInput"

placeholder="Szukaj dokumentu, lokalu, regału..."

>


</div>







<!-- LOKALIZACJE -->


<section class="location-section">


<h3>

Lokalizacje

</h3>


<div 
id="locationTabs"
class="location-tabs">

</div>


</section>








<!-- FILTRY -->


<div class="filters">


<select id="typeFilter">


<option value="">

Wszystkie typy

</option>


</select>




<select id="shelfFilter">


<option value="">

Wszystkie regały

</option>


</select>




<select id="statusFilter">


<option value="">

Wszystkie statusy

</option>


<option value="OK">

OK

</option>


<option value="Do uzupełnienia">

Do uzupełnienia

</option>


<option value="Brak dokumentu">

Brak dokumentu

</option>


<option value="Nieaktualny">

Nieaktualny

</option>


</select>


</div>









<!-- LISTA -->

<div id="results">


</div>





</main>









<!-- MODAL -->

<div 
id="modalOverlay"
class="modal-overlay hidden">



<div class="modal">





<button

id="closeModal"

class="close-modal">

×

</button>







<div class="modal-header">


<h2 id="modalTitle">

Dodaj dokument

</h2>


</div>








<div class="form-grid">






<div class="form-group">


<label>

Lokalizacja *

</label>


<select id="location">


<option value="">

Wybierz

</option>


<option>
OKĘCIE
</option>

<option>
RADOM
</option>

<option>
MODLIN
</option>

<option>
SONATA
</option>

<option>
RZESZÓW
</option>

<option>
KATOWICE
</option>

<option>
KRAKÓW
</option>

<option>
ZIELONA GÓRA
</option>

<option>
FRANCJA
</option>

<option>
BYDGOSZCZ
</option>

<option>
POZNAŃ
</option>

<option>
WROCŁAW
</option>


</select>


</div>







<div class="form-group">


<label>

Numer lokalu *

</label>


<input 
id="number"
placeholder="np. 101">


</div>








<div class="form-group">


<label>

Nazwa dokumentu *

</label>


<input 
id="name"
placeholder="np. Umowa najmu">


</div>








<div class="form-group">


<label>

Typ *

</label>


<input 
id="type"
placeholder="np. Umowa">


</div>








<div class="form-group">


<label>

Regał *

</label>


<input 
id="shelf"
placeholder="np. A3">


</div>








<div class="form-group">


<label>

Półka *

</label>


<input 
id="level"
placeholder="np. 2">


</div>








<div class="form-group">


<label>

Segregator *

</label>


<input 
id="folder"
placeholder="np. Czerwony">


</div>







<div class="form-group">


<label>

Status *

</label>


<select id="status">


<option value="OK">

OK

</option>


<option value="Do uzupełnienia">

Do uzupełnienia

</option>


<option value="Brak dokumentu">

Brak dokumentu

</option>


<option value="Nieaktualny">

Nieaktualny

</option>


</select>


</div>







<div class="form-group full">


<label>

Uwagi

</label>


<textarea

id="notes"

placeholder="Dodatkowe informacje">

</textarea>


</div>



</div>









<div id="successBox"
class="success hidden">


Dokument zapisany.

</div>



<div id="errorBox"
class="error hidden">


</div>








<div class="modal-buttons">


<button

id="saveBtn"

class="primary-btn">

Zapisz dokument

</button>


</div>




</div>


</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./js/supabase.js"></script>

<script src="./js/app.js"></script>

<script src="./js/admin.js"></script>

<script src="./js/menu.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="./js/export.js"></script>



</body>

</html>
