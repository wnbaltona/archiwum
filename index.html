<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<title>Przeglądy</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>


<script src="supabase-config.js"></script>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">


<h1>
System kontroli przeglądów
</h1>



<select id="miasto">

<option value="">
Wszystkie miasta
</option>

</select>



<input 
id="szukaj"
placeholder="Szukaj lokalu..."
>



<table>


<thead>

<tr>

<th>Miasto</th>

<th>Lokal</th>

<th>Typ</th>

<th>Data</th>

<th>Następny</th>

<th>Status</th>


</tr>


</thead>


<tbody id="lista">


</tbody>


</table>


</div>



<script>


let dokumenty=[];



async function start(){


const {data,error}=await supabaseClient

.from("dokumenty")

.select("*")

.order("miasto");



if(error){

console.error(error);

alert(error.message);

return;

}


dokumenty=data;


zaladujMiasta();


pokaz(dokumenty);


}




function zaladujMiasta(){


let select=
document.getElementById("miasto");



let miasta=[

...new Set(

dokumenty.map(x=>x.miasto)

)

];



miasta.forEach(m=>{


let option=document.createElement("option");

option.value=m;

option.textContent=m;


select.appendChild(option);



});


}





function pokaz(dane){


let tabela=
document.getElementById("lista");



tabela.innerHTML="";



dane.forEach(x=>{


let klasa="";


if(x.status=="PO TERMINIE")

klasa="status-alert";



if(x.status=="OK")

klasa="status-ok";



tabela.innerHTML += `


<tr>

<td>${x.miasto ?? ""}</td>

<td>${x.nr_lokalu ?? ""}</td>

<td>${x.typ_przegladu ?? ""}</td>

<td>${x.data_przegladu ?? ""}</td>

<td>${x.kolejny_przeglad ?? ""}</td>

<td class="${klasa}">
${x.status ?? ""}
</td>


</tr>


`;



});


}





document
.getElementById("miasto")
.addEventListener(
"change",
function(){


let m=this.value;


if(m==""){

pokaz(dokumenty);

}

else{


pokaz(

dokumenty.filter(
x=>x.miasto==m
)

);


}



});







document
.getElementById("szukaj")
.addEventListener(
"keyup",
function(){


let tekst=this.value.toLowerCase();



pokaz(

dokumenty.filter(
x=>

JSON.stringify(x)
.toLowerCase()
.includes(tekst)

)

);



});





start();



</script>


</body>

</html>
